[package]
name = "sshu"
version = "0.1.1"
edition = "2021"

[lib]
name = "sshu"
path = "src/lib.rs"

[[bin]]
name = "sshu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
percent-encoding = "2.3.2"
rpassword = "7.5.4"
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
alacritty_terminal = { version = "0.25", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
